<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <rect width="1000" height="640" rx="18" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">저장 파일 3개 — JSONL은 "한 줄 = JSON 한 개"</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#475569">프로그램이 꺼져도 파일은 남는다 → 다시 켜면 파일을 읽어서 그대로 이어진다</text>

  <g font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="12.5">
    <rect x="30" y="92" width="940" height="138" rx="12" fill="#0f172a"/>
    <text x="48" y="117" font-size="13.5" fill="#fcd34d">data/transactions.jsonl</text>
    <text x="950" y="117" text-anchor="end" fill="#94a3b8">새 거래는 맨 아래에 한 줄 추가(append)</text>
    <text x="48" y="146" font-size="11.5" fill="#e2e8f0">{"id": "TX-000010", "type": "expense", "date": "2024-01-12", "amount": 20000, "category": "transport", "memo": "", "tags": []}</text>
    <text x="48" y="171" font-size="11.5" fill="#e2e8f0">{"id": "TX-000011", "type": "income", "date": "2024-01-14", "amount": 3000000, "category": "salary", "memo": "", "tags": []}</text>
    <text x="48" y="196" font-size="11.5" fill="#e2e8f0">{"id": "TX-000012", "type": "expense", "date": "2024-01-15", "amount": 15000, "category": "food", "memo": "점심", "tags": ["meal"]}</text>
    <text x="48" y="218" fill="#64748b">...  (줄 하나 = 거래 한 건 → 한 줄씩 읽으면 한 건씩 처리 가능)</text>

    <rect x="30" y="244" width="460" height="104" rx="12" fill="#0f172a"/>
    <text x="48" y="269" font-size="13.5" fill="#fcd34d">data/categories.jsonl</text>
    <text x="48" y="296" fill="#e2e8f0">{"name": "food"}</text>
    <text x="48" y="318" fill="#e2e8f0">{"name": "transport"}</text>
    <text x="48" y="340" fill="#64748b">...</text>

    <rect x="510" y="244" width="460" height="104" rx="12" fill="#0f172a"/>
    <text x="528" y="269" font-size="13.5" fill="#fcd34d">data/budgets.jsonl</text>
    <text x="528" y="296" fill="#e2e8f0">{"month": "2024-01", "amount": 500000}</text>
    <text x="528" y="318" fill="#e2e8f0">{"month": "2024-02", "amount": 450000}</text>
    <text x="528" y="340" fill="#64748b">...</text>
  </g>

  <!-- comparison -->
  <text x="500" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">JSONL vs CSV — 이 저장소의 선택: JSONL (가져오기/내보내기만 CSV)</text>
  <rect x="30" y="402" width="940" height="44" rx="10" fill="#f1f5f9"/>
  <text x="50" y="430" font-size="14.5" font-weight="700" fill="#334155">비교 기준</text>
  <text x="380" y="430" font-size="14.5" font-weight="700" fill="#15803d">JSONL (저장용으로 선택)</text>
  <text x="700" y="430" font-size="14.5" font-weight="700" fill="#b45309">CSV</text>
  <g font-size="13.5" fill="#334155">
    <text x="50" y="474">tags 처럼 "목록" 값</text>
    <text x="380" y="474">["meal", "lunch"] 그대로 저장</text>
    <text x="700" y="474">"meal,lunch" 문자열로 쪼개고 합쳐야 함</text>
    <line x1="40" y1="488" x2="960" y2="488" stroke="#e2e8f0"/>
    <text x="50" y="514">숫자 / 문자 구분</text>
    <text x="380" y="514">15000 은 숫자로 읽힘</text>
    <text x="700" y="514">전부 문자열 → int() 변환 필요</text>
    <line x1="40" y1="528" x2="960" y2="528" stroke="#e2e8f0"/>
    <text x="50" y="554">한 줄씩 스트리밍</text>
    <text x="380" y="554">가능 (줄 = 레코드)</text>
    <text x="700" y="554">가능 (단, 메모 속 줄바꿈 주의)</text>
    <line x1="40" y1="568" x2="960" y2="568" stroke="#e2e8f0"/>
    <text x="50" y="594">엑셀로 열기 · 용량</text>
    <text x="380" y="594">불편 · 필드 이름 반복으로 큼</text>
    <text x="700" y="594">편함 · 작음 → 그래서 export용</text>
  </g>
</svg>
