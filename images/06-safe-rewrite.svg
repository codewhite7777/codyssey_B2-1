<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="640" rx="18" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">파일 기반 update / delete — "새로 써서 통째로 바꿔 끼우기"</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#475569">텍스트 파일은 중간 한 줄만 지울 수 없다 → 전체를 다시 써야 한다. 문제는 "쓰다가 멈추면?"</text>

  <!-- danger -->
  <rect x="30" y="88" width="940" height="170" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="52" y="118" font-size="17" font-weight="700" fill="#be123c">위험한 방법: 원본을 바로 open(path, "w") 로 열어 다시 쓰기</text>
  <rect x="52" y="136" width="200" height="100" rx="10" fill="#fff" stroke="#fda4af"/>
  <text x="152" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">원본 1,000줄</text>
  <g fill="#94a3b8"><rect x="72" y="172" width="160" height="8" rx="2"/><rect x="72" y="186" width="160" height="8" rx="2"/><rect x="72" y="200" width="160" height="8" rx="2"/><rect x="72" y="214" width="160" height="8" rx="2"/></g>
  <line x1="256" y1="186" x2="300" y2="186" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="278" y="176" text-anchor="middle" font-size="11" fill="#be123c">"w"</text>
  <rect x="304" y="136" width="200" height="100" rx="10" fill="#fff" stroke="#fda4af"/>
  <text x="404" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">열자마자 0줄</text>
  <text x="404" y="196" text-anchor="middle" font-size="12.5" fill="#64748b">(내용이 즉시 비워짐)</text>
  <line x1="508" y1="186" x2="552" y2="186" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="556" y="136" width="200" height="100" rx="10" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
  <text x="656" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#be123c">500줄 쓰다 오류·종료</text>
  <g fill="#e11d48" opacity="0.7"><rect x="576" y="172" width="160" height="8" rx="2"/><rect x="576" y="186" width="160" height="8" rx="2"/></g>
  <text x="656" y="222" text-anchor="middle" font-size="12.5" fill="#be123c">나머지 500줄 증발</text>
  <text x="780" y="170" font-size="14" fill="#334155">• 되돌릴 원본이 없다</text>
  <text x="780" y="196" font-size="14" fill="#334155">• 마지막 줄이 반쯤</text>
  <text x="792" y="218" font-size="14" fill="#334155">잘려 다음 실행도 실패</text>

  <!-- safe -->
  <rect x="30" y="278" width="940" height="342" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="52" y="308" font-size="17" font-weight="700" fill="#15803d">안전한 방법: 임시 파일에 다 쓴 뒤 os.replace() 로 한 번에 교체</text>

  <rect x="52" y="328" width="205" height="150" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <circle cx="76" cy="352" r="13" fill="#16a34a"/><text x="76" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="98" y="358" font-size="14.5" font-weight="700" fill="#166534">id 먼저 확인</text>
  <text x="70" y="390" font-size="13" fill="#334155">find(id) 로 찾아보고</text>
  <text x="70" y="412" font-size="13" fill="#334155">없으면 "없는 데이터"</text>
  <text x="70" y="434" font-size="13" fill="#334155">안내 + 파일은 그대로</text>

  <line x1="261" y1="403" x2="287" y2="403" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="291" y="328" width="205" height="150" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <circle cx="315" cy="352" r="13" fill="#16a34a"/><text x="315" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="337" y="358" font-size="14.5" font-weight="700" fill="#166534">원본 한 줄씩 읽기</text>
  <text x="309" y="390" font-size="13" fill="#334155">제너레이터로 1건씩</text>
  <text x="309" y="412" font-size="13" fill="#334155">원본은 읽기만 한다</text>
  <text x="309" y="434" font-size="13" fill="#334155">(절대 수정 안 함)</text>

  <line x1="500" y1="403" x2="526" y2="403" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="530" y="328" width="205" height="150" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <circle cx="554" cy="352" r="13" fill="#16a34a"/><text x="554" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="576" y="358" font-size="14.5" font-weight="700" fill="#166534">임시 파일에 쓰기</text>
  <text x="548" y="390" font-size="13" fill="#334155">같은 폴더 *.tmp 에</text>
  <text x="548" y="412" font-size="13" fill="#334155">update: 바뀐 줄로 교체</text>
  <text x="548" y="434" font-size="13" fill="#334155">delete: 그 줄만 건너뜀</text>

  <line x1="739" y1="403" x2="765" y2="403" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="769" y="328" width="181" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="793" cy="352" r="13" fill="#16a34a"/><text x="793" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="815" y="358" font-size="14.5" font-weight="700" fill="#166534">한 번에 교체</text>
  <text x="787" y="390" font-size="13" fill="#334155">os.replace(tmp, 원본)</text>
  <text x="787" y="412" font-size="13" fill="#334155">파일 이름표만 바꿔</text>
  <text x="787" y="434" font-size="13" fill="#334155">붙이는 순간 동작</text>

  <rect x="52" y="498" width="898" height="104" rx="12" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="72" y="528" font-size="15" font-weight="700" fill="#0f172a">어느 순간에 멈춰도 결과는 둘 중 하나</text>
  <text x="72" y="556" font-size="14" fill="#334155">• 2~3 단계에서 멈춤 → 원본 그대로 (임시 파일은 finally 에서 삭제)</text>
  <text x="72" y="582" font-size="14" fill="#334155">• 4 단계 이후 → 완성된 새 파일.   "반만 고쳐진 파일"은 생기지 않는다</text>
</svg>
