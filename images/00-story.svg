<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <rect width="1000" height="1250" rx="20" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">용돈 기입장으로 보내는 1월 한 달</text>
  <text x="500" y="98" text-anchor="middle" font-size="16" fill="#64748b">상황이 생기면 → 명령어 한 줄 → 결과가 바로 나온다</text>

  <!-- timeline line -->
  <line x1="110" y1="160" x2="110" y2="1015" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== row 1 : budget ===== -->
  <g>
    <circle cx="110" cy="200" r="34" fill="#f59e0b"/>
    <circle cx="110" cy="200" r="16" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="110" cy="200" r="6" fill="#fff"/>
    <text x="165" y="194" font-size="21" font-weight="800" fill="#0f172a">1월 1일</text>
    <text x="165" y="222" font-size="15" font-weight="700" fill="#b45309">예산 정하기</text>

    <rect x="330" y="140" width="630" height="140" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="358" y="182" font-size="21" font-weight="800" fill="#0f172a">"이번 달은 50만원만 쓰자"</text>
    <rect x="358" y="198" width="574" height="40" rx="10" fill="#0f172a"/>
    <text x="376" y="224" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="15" fill="#fcd34d">budget set --month 2024-01 --amount 500000</text>
    <text x="358" y="258" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="14" fill="#475569">→ [저장 완료] 2024-01 예산 500000원</text>
  </g>

  <!-- ===== row 2 : income ===== -->
  <g>
    <circle cx="110" cy="370" r="34" fill="#16a34a"/>
    <line x1="96" y1="370" x2="124" y2="370" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="356" x2="110" y2="384" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="364" font-size="21" font-weight="800" fill="#0f172a">1월 14일</text>
    <text x="165" y="392" font-size="15" font-weight="700" fill="#15803d">수입 기록</text>

    <rect x="330" y="310" width="630" height="140" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="358" y="352" font-size="21" font-weight="800" fill="#0f172a">"월급 300만원 들어왔다"</text>
    <rect x="358" y="368" width="574" height="40" rx="10" fill="#0f172a"/>
    <text x="376" y="394" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="15" fill="#86efac">add</text>
    <text x="420" y="394" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="14" fill="#94a3b8">→ 질문에 답: income · salary · 3000000</text>
    <text x="358" y="428" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="14" fill="#475569">→ [저장 완료] id=TX-000003</text>
  </g>

  <!-- ===== row 3 : expense ===== -->
  <g>
    <circle cx="110" cy="540" r="34" fill="#e11d48"/>
    <line x1="96" y1="540" x2="124" y2="540" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="534" font-size="21" font-weight="800" fill="#0f172a">1월 15일</text>
    <text x="165" y="562" font-size="15" font-weight="700" fill="#be123c">지출 기록</text>

    <rect x="330" y="480" width="630" height="140" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="358" y="522" font-size="21" font-weight="800" fill="#0f172a">"점심으로 15,000원 썼다"</text>
    <rect x="358" y="538" width="574" height="40" rx="10" fill="#0f172a"/>
    <text x="376" y="564" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="15" fill="#86efac">add</text>
    <text x="420" y="564" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="14" fill="#94a3b8">→ 질문에 답: expense · food · 15000 · 점심</text>
    <text x="358" y="598" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="14" fill="#475569">→ [저장 완료] id=TX-000004</text>
  </g>

  <!-- ===== row 4 : search ===== -->
  <g>
    <circle cx="110" cy="710" r="34" fill="#2563eb"/>
    <circle cx="105" cy="705" r="11" fill="none" stroke="#fff" stroke-width="4"/>
    <line x1="113" y1="713" x2="123" y2="723" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="704" font-size="21" font-weight="800" fill="#0f172a">1월 20일</text>
    <text x="165" y="732" font-size="15" font-weight="700" fill="#1d4ed8">찾아보기</text>

    <rect x="330" y="650" width="630" height="140" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="358" y="692" font-size="21" font-weight="800" fill="#0f172a">"점심값 쓴 거 어디 있더라?"</text>
    <rect x="358" y="708" width="574" height="40" rx="10" fill="#0f172a"/>
    <text x="376" y="734" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="15" fill="#93c5fd">search --q 점심</text>
    <text x="358" y="768" font-size="14.5" fill="#475569">→ 점심 기록 3건이 최신순으로 나온다  (전체 목록은 list)</text>
  </g>

  <!-- ===== row 5 : delete ===== -->
  <g>
    <circle cx="110" cy="880" r="34" fill="#64748b"/>
    <rect x="99" y="875" width="22" height="20" rx="2" fill="none" stroke="#fff" stroke-width="3.5"/>
    <line x1="94" y1="870" x2="126" y2="870" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="105" y1="865" x2="115" y2="865" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="165" y="874" font-size="21" font-weight="800" fill="#0f172a">1월 21일</text>
    <text x="165" y="902" font-size="15" font-weight="700" fill="#475569">고치기 · 지우기</text>

    <rect x="330" y="820" width="630" height="140" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="358" y="862" font-size="21" font-weight="800" fill="#0f172a">"앗, 같은 걸 두 번 넣었네"</text>
    <rect x="358" y="878" width="574" height="40" rx="10" fill="#0f172a"/>
    <text x="376" y="904" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="15" fill="#e2e8f0">delete --id TX-000006</text>
    <text x="358" y="938" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="14" fill="#475569">→ [삭제 완료] id=TX-000006   (값만 고칠 땐 update)</text>
  </g>

  <!-- ===== row 6 : summary ===== -->
  <g>
    <circle cx="110" cy="1050" r="34" fill="#9333ea"/>
    <rect x="95" y="1052" width="7" height="13" fill="#fff"/>
    <rect x="106" y="1043" width="7" height="22" fill="#fff"/>
    <rect x="117" y="1034" width="7" height="31" fill="#fff"/>
    <text x="165" y="1044" font-size="21" font-weight="800" fill="#0f172a">1월 31일</text>
    <text x="165" y="1072" font-size="15" font-weight="700" fill="#7e22ce">한 달 결산</text>

    <rect x="330" y="990" width="630" height="140" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text x="358" y="1032" font-size="21" font-weight="800" fill="#0f172a">"이번 달 얼마나 썼지?"</text>
    <rect x="358" y="1048" width="574" height="40" rx="10" fill="#0f172a"/>
    <text x="376" y="1074" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="15" fill="#d8b4fe">summary --month 2024-01 --top 3</text>
    <text x="358" y="1108" font-size="14.5" fill="#475569">→ 지출 215,000원 / 예산 500,000원</text>
    <rect x="640" y="1095" width="230" height="16" rx="8" fill="#e9d5ff"/>
    <rect x="640" y="1095" width="99" height="16" rx="8" fill="#9333ea"/>
    <text x="884" y="1109" font-size="16" font-weight="800" fill="#7e22ce">43%</text>
  </g>

  <!-- footer -->
  <rect x="40" y="1160" width="450" height="62" rx="16" fill="#0f172a"/>
  <text x="66" y="1189" font-size="16" font-weight="800" fill="#fcd34d">기록은 JSONL 파일 3개에 남는다</text>
  <text x="66" y="1210" font-size="13.5" fill="#cbd5e1">프로그램을 껐다 켜도 그대로</text>

  <rect x="510" y="1160" width="450" height="62" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="536" y="1189" font-size="16" font-weight="800" fill="#155e75">엑셀과는 CSV로 주고받기</text>
  <text x="536" y="1210" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13.5" fill="#0f172a">export · import</text>
</svg>
