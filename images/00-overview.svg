<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="600" rx="18" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">B2-1 용돈 기입장 — 한눈에 보기</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#475569">명령어 한 줄 입력 → 프로그램이 처리 → 파일 3개에 저장 (껐다 켜도 데이터가 남는다)</text>

  <!-- terminal -->
  <rect x="30" y="95" width="320" height="330" rx="14" fill="#0f172a"/>
  <circle cx="52" cy="115" r="6" fill="#ef4444"/><circle cx="72" cy="115" r="6" fill="#f59e0b"/><circle cx="92" cy="115" r="6" fill="#22c55e"/>
  <text x="335" y="120" text-anchor="end" font-size="12" fill="#94a3b8">터미널 (사용자)</text>
  <g font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13.5">
    <text x="48" y="150" fill="#94a3b8">$ python -m budget_app ...</text>
    <text x="48" y="180" fill="#86efac">add</text><text x="140" y="180" fill="#cbd5e1">거래 추가 (대화형)</text>
    <text x="48" y="205" fill="#86efac">list</text><text x="140" y="205" fill="#cbd5e1">최신순 목록</text>
    <text x="48" y="230" fill="#86efac">search</text><text x="140" y="230" fill="#cbd5e1">조건 검색</text>
    <text x="48" y="255" fill="#86efac">update</text><text x="140" y="255" fill="#cbd5e1">수정</text>
    <text x="48" y="280" fill="#86efac">delete</text><text x="140" y="280" fill="#cbd5e1">삭제</text>
    <text x="48" y="305" fill="#fcd34d">summary</text><text x="140" y="305" fill="#cbd5e1">월별 요약 + TOP N</text>
    <text x="48" y="330" fill="#fcd34d">budget</text><text x="140" y="330" fill="#cbd5e1">월 예산 설정</text>
    <text x="48" y="355" fill="#fcd34d">category</text><text x="140" y="355" fill="#cbd5e1">카테고리 add/list/remove</text>
    <text x="48" y="380" fill="#93c5fd">import</text><text x="140" y="380" fill="#cbd5e1">CSV 가져오기</text>
    <text x="48" y="405" fill="#93c5fd">export</text><text x="140" y="405" fill="#cbd5e1">CSV 내보내기</text>
  </g>

  <line x1="354" y1="260" x2="396" y2="260" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- app -->
  <rect x="400" y="95" width="290" height="330" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="545" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">budget_app 패키지</text>
  <text x="545" y="146" text-anchor="middle" font-size="12.5" fill="#475569">Python 3.10+ · 표준 라이브러리만</text>
  <rect x="425" y="162" width="240" height="50" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="545" y="185" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">CLI</text>
  <text x="545" y="203" text-anchor="middle" font-size="12" fill="#475569">입력 받기 · 결과 출력</text>
  <rect x="425" y="222" width="240" height="50" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="545" y="245" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">서비스</text>
  <text x="545" y="263" text-anchor="middle" font-size="12" fill="#475569">검증 · 계산 · 규칙</text>
  <rect x="425" y="282" width="240" height="50" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="545" y="305" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">저장소</text>
  <text x="545" y="323" text-anchor="middle" font-size="12" fill="#475569">파일 읽기/쓰기</text>
  <rect x="425" y="342" width="240" height="50" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="545" y="365" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">모델</text>
  <text x="545" y="383" text-anchor="middle" font-size="12" fill="#475569">Transaction 데이터 모양</text>

  <line x1="694" y1="260" x2="736" y2="260" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="736" y1="285" x2="694" y2="285" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- data folder -->
  <rect x="740" y="95" width="230" height="330" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="855" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">data/ (영구 저장)</text>
  <text x="855" y="146" text-anchor="middle" font-size="12.5" fill="#78350f">--data-dir 로 위치 변경 가능</text>
  <rect x="760" y="165" width="190" height="64" rx="10" fill="#fff" stroke="#fde68a" stroke-width="2"/>
  <text x="855" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">transactions.jsonl</text>
  <text x="855" y="214" text-anchor="middle" font-size="12" fill="#475569">거래 내역 (1줄 = 1건)</text>
  <rect x="760" y="244" width="190" height="64" rx="10" fill="#fff" stroke="#fde68a" stroke-width="2"/>
  <text x="855" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">categories.jsonl</text>
  <text x="855" y="293" text-anchor="middle" font-size="12" fill="#475569">카테고리 목록</text>
  <rect x="760" y="323" width="190" height="64" rx="10" fill="#fff" stroke="#fde68a" stroke-width="2"/>
  <text x="855" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">budgets.jsonl</text>
  <text x="855" y="372" text-anchor="middle" font-size="12" fill="#475569">월별 예산</text>

  <!-- learning keywords -->
  <text x="500" y="468" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">이 미션에서 진짜 배우는 것 (평가에서 "설명"을 요구)</text>
  <g font-size="13.5">
    <rect x="30" y="488" width="225" height="82" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="142" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">제너레이터 yield</text>
    <text x="142" y="541" text-anchor="middle" fill="#334155">파일을 한 줄씩 흘려 읽기</text>
    <text x="142" y="560" text-anchor="middle" fill="#334155">→ 메모리 절약</text>
    <rect x="270" y="488" width="225" height="82" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text x="382" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">데코레이터 @</text>
    <text x="382" y="541" text-anchor="middle" fill="#334155">오류 처리 같은 공통 일을</text>
    <text x="382" y="560" text-anchor="middle" fill="#334155">한 곳에 모으기</text>
    <rect x="510" y="488" width="225" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="622" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">타입 힌트</text>
    <text x="622" y="541" text-anchor="middle" fill="#334155">함수의 입력·출력 약속을</text>
    <text x="622" y="560" text-anchor="middle" fill="#334155">코드에 적어두기</text>
    <rect x="750" y="488" width="220" height="82" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="860" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#be123c">안전한 오류 처리</text>
    <text x="860" y="541" text-anchor="middle" fill="#334155">[오류]+[힌트] 출력</text>
    <text x="860" y="560" text-anchor="middle" fill="#334155">종료 코드 0 아님</text>
  </g>
</svg>
