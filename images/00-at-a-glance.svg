<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <rect width="1000" height="600" rx="18" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" font-size="27" font-weight="800" fill="#0f172a">B2-1 미션 = 만드는 것 + 배우는 것 + 지킬 것</text>
  <text x="500" y="76" text-anchor="middle" font-size="15" fill="#475569">기능은 "용돈 기입장", 평가는 "왜 그렇게 만들었는지 설명할 수 있는가"</text>

  <!-- column 1 : build -->
  <rect x="30" y="100" width="300" height="475" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="30" y="100" width="300" height="60" rx="16" fill="#2563eb"/>
  <rect x="30" y="140" width="300" height="20" fill="#2563eb"/>
  <text x="180" y="139" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">① 만드는 것</text>
  <text x="180" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">명령어 10개짜리 터미널 가계부</text>

  <g font-size="14">
    <rect x="48" y="200" width="264" height="62" rx="10" fill="#fff"/>
    <text x="62" y="224" font-weight="800" fill="#16a34a">기록</text>
    <text x="62" y="248" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13.5" fill="#0f172a">add · update · delete</text>

    <rect x="48" y="272" width="264" height="62" rx="10" fill="#fff"/>
    <text x="62" y="296" font-weight="800" fill="#2563eb">조회</text>
    <text x="62" y="320" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13.5" fill="#0f172a">list · search</text>

    <rect x="48" y="344" width="264" height="62" rx="10" fill="#fff"/>
    <text x="62" y="368" font-weight="800" fill="#9333ea">정리</text>
    <text x="62" y="392" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13.5" fill="#0f172a">summary · budget · category</text>

    <rect x="48" y="416" width="264" height="62" rx="10" fill="#fff"/>
    <text x="62" y="440" font-weight="800" fill="#0891b2">주고받기 (CSV)</text>
    <text x="62" y="464" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13.5" fill="#0f172a">import · export</text>

    <rect x="48" y="490" width="264" height="68" rx="10" fill="#dbeafe"/>
    <text x="62" y="516" font-weight="800" fill="#1e3a8a">+ 저장 파일 3개</text>
    <text x="62" y="542" font-size="13" fill="#334155">거래 · 카테고리 · 예산</text>
  </g>

  <!-- column 2 : learn -->
  <rect x="350" y="100" width="300" height="475" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <rect x="350" y="100" width="300" height="60" rx="16" fill="#9333ea"/>
  <rect x="350" y="140" width="300" height="20" fill="#9333ea"/>
  <text x="500" y="139" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">② 배우는 것</text>
  <text x="500" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">평가에서 "어떻게 · 왜"를 묻는 4가지</text>

  <g font-size="13.5">
    <rect x="368" y="200" width="264" height="86" rx="10" fill="#fff"/>
    <text x="382" y="226" font-size="16" font-weight="800" fill="#0f172a">제너레이터 yield</text>
    <text x="382" y="250" fill="#334155">파일을 빨대처럼 한 줄씩</text>
    <text x="382" y="272" fill="#7e22ce">→ 커져도 메모리 일정</text>

    <rect x="368" y="294" width="264" height="86" rx="10" fill="#fff"/>
    <text x="382" y="320" font-size="16" font-weight="800" fill="#0f172a">데코레이터 @</text>
    <text x="382" y="344" fill="#334155">모든 명령을 같은 포장지로</text>
    <text x="382" y="366" fill="#7e22ce">→ 오류 처리 규칙 1곳</text>

    <rect x="368" y="388" width="264" height="86" rx="10" fill="#fff"/>
    <text x="382" y="414" font-size="16" font-weight="800" fill="#0f172a">타입 힌트</text>
    <text x="382" y="438" fill="#334155">함수의 입력·출력 계약서</text>
    <text x="382" y="460" fill="#7e22ce">→ 실수를 실행 전에 발견</text>

    <rect x="368" y="482" width="264" height="76" rx="10" fill="#fff"/>
    <text x="382" y="508" font-size="16" font-weight="800" fill="#0f172a">모듈 · 클래스 나누기</text>
    <text x="382" y="532" fill="#334155">카운터 / 주방장 / 창고</text>
    <text x="382" y="550" font-size="12.5" fill="#7e22ce">→ 바꿀 곳이 한 군데</text>
  </g>

  <!-- column 3 : rules -->
  <rect x="670" y="100" width="300" height="475" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
  <rect x="670" y="100" width="300" height="60" rx="16" fill="#e11d48"/>
  <rect x="670" y="140" width="300" height="20" fill="#e11d48"/>
  <text x="820" y="139" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">③ 지킬 것</text>
  <text x="820" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">어기면 바로 감점되는 규칙</text>

  <g font-size="14" fill="#0f172a">
    <rect x="688" y="200" width="264" height="358" rx="10" fill="#fff"/>
    <circle cx="708" cy="226" r="10" fill="#e11d48"/><text x="708" y="231" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>
    <text x="726" y="231" font-weight="700">표준 라이브러리만</text>
    <text x="726" y="251" font-size="12.5" fill="#64748b">pip install 금지 · Python 3.10+</text>

    <circle cx="708" cy="282" r="10" fill="#e11d48"/><text x="708" y="287" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>
    <text x="726" y="287" font-weight="700">저장 파일 3개 이상</text>
    <text x="726" y="307" font-size="12.5" fill="#64748b">JSONL 또는 CSV 중 하나</text>

    <circle cx="708" cy="338" r="10" fill="#e11d48"/><text x="708" y="343" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>
    <text x="726" y="343" font-weight="700">모듈 3개 이상</text>
    <text x="726" y="363" font-size="12.5" fill="#64748b">한 파일에 몰아넣기 금지</text>

    <circle cx="708" cy="394" r="10" fill="#e11d48"/><text x="708" y="399" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>
    <text x="726" y="399" font-weight="700">옵션은 -- 표기</text>
    <text x="726" y="419" font-size="12.5" fill="#64748b">--help · --limit · --month</text>

    <circle cx="708" cy="450" r="10" fill="#e11d48"/><text x="708" y="455" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>
    <text x="726" y="455" font-weight="700">스택트레이스 금지</text>
    <text x="726" y="475" font-size="12.5" fill="#64748b">[오류] + [힌트] 로 안내</text>

    <circle cx="708" cy="506" r="10" fill="#e11d48"/><text x="708" y="511" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>
    <text x="726" y="511" font-weight="700">오류면 종료 코드 ≠ 0</text>
    <text x="726" y="531" font-size="12.5" fill="#64748b">정상 종료만 0</text>
  </g>
</svg>
