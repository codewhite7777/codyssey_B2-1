<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1000" height="660" rx="18" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">제너레이터 — 양동이로 퍼오기 vs 빨대로 마시기</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#475569">거래 10만 건이 든 파일에서 list --limit 3 을 실행한다면?</text>

  <!-- left: load all -->
  <rect x="30" y="88" width="455" height="300" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="52" y="118" font-size="17" font-weight="700" fill="#be123c">한꺼번에 읽기 (리스트)</text>
  <rect x="52" y="134" width="410" height="34" rx="8" fill="#fff"/>
  <text x="66" y="157" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13" fill="#0f172a">rows = f.readlines()   # 10만 줄 전부</text>
  <!-- bucket -->
  <rect x="70" y="190" width="150" height="150" rx="10" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
  <g fill="#e11d48" opacity="0.75">
    <rect x="82" y="202" width="126" height="10" rx="3"/><rect x="82" y="218" width="126" height="10" rx="3"/>
    <rect x="82" y="234" width="126" height="10" rx="3"/><rect x="82" y="250" width="126" height="10" rx="3"/>
    <rect x="82" y="266" width="126" height="10" rx="3"/><rect x="82" y="282" width="126" height="10" rx="3"/>
    <rect x="82" y="298" width="126" height="10" rx="3"/><rect x="82" y="314" width="126" height="10" rx="3"/>
  </g>
  <text x="145" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">메모리: 10만 건 전부</text>
  <text x="245" y="215" font-size="14" fill="#334155">• 3건만 필요한데</text>
  <text x="258" y="237" font-size="14" fill="#334155">10만 건을 다 들고 있음</text>
  <text x="245" y="267" font-size="14" fill="#334155">• 파일이 커질수록</text>
  <text x="258" y="289" font-size="14" fill="#334155">메모리도 같이 커짐</text>
  <text x="245" y="319" font-size="14" fill="#334155">• 다 읽을 때까지</text>
  <text x="258" y="341" font-size="14" fill="#334155">아무 일도 못 함</text>

  <!-- right: generator -->
  <rect x="515" y="88" width="455" height="300" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="537" y="118" font-size="17" font-weight="700" fill="#15803d">제너레이터 (yield, 한 줄씩)</text>
  <rect x="537" y="134" width="410" height="34" rx="8" fill="#fff"/>
  <text x="551" y="157" font-family="'D2Coding', 'Consolas', 'Noto Sans Mono CJK KR', monospace" font-size="13" fill="#0f172a">for line in f: yield Transaction(...)</text>
  <!-- conveyor -->
  <rect x="545" y="215" width="70" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="580" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">파일</text>
  <text x="580" y="258" text-anchor="middle" font-size="11" fill="#92400e">10만 줄</text>
  <line x1="618" y1="243" x2="660" y2="243" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <rect x="664" y="228" width="34" height="30" rx="5" fill="#22c55e"/>
  <text x="681" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1건</text>
  <line x1="701" y1="243" x2="740" y2="243" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <rect x="744" y="215" width="86" height="56" rx="8" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="787" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">조건 검사</text>
  <text x="787" y="258" text-anchor="middle" font-size="11" fill="#475569">search 필터</text>
  <line x1="833" y1="243" x2="866" y2="243" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <rect x="870" y="205" width="80" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="910" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">TOP 3</text>
  <rect x="882" y="236" width="56" height="8" rx="2" fill="#16a34a"/>
  <rect x="882" y="250" width="56" height="8" rx="2" fill="#16a34a"/>
  <rect x="882" y="264" width="56" height="8" rx="2" fill="#16a34a"/>
  <text x="742" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">메모리: 지금 보는 1건 + 남길 3건</text>
  <text x="537" y="337" font-size="13.5" fill="#334155">• heapq.nlargest(3, 스트림, key=날짜) → 최신 3건만 기억</text>
  <text x="537" y="362" font-size="13.5" fill="#334155">• 파일이 100배 커져도 메모리는 그대로 (시간만 늘어남)</text>

  <!-- bottom: how yield pauses -->
  <rect x="30" y="408" width="940" height="232" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="52" y="438" font-size="17" font-weight="700" fill="#0f172a">yield 는 "일시정지 버튼" — 달라고 할 때만 1건 만들고 멈춘다</text>

  <rect x="52" y="458" width="200" height="160" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="152" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">① 호출만 하면</text>
  <text x="152" y="512" text-anchor="middle" font-size="13" fill="#334155">gen = iter_transactions()</text>
  <text x="152" y="540" text-anchor="middle" font-size="13" fill="#334155">아직 파일을</text>
  <text x="152" y="562" text-anchor="middle" font-size="13" fill="#334155">한 줄도 안 읽음</text>
  <text x="152" y="596" text-anchor="middle" font-size="12" fill="#64748b">(준비만 된 상태)</text>

  <line x1="256" y1="538" x2="290" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="294" y="458" width="200" height="160" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="394" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">② for 가 1건 요청</text>
  <text x="394" y="512" text-anchor="middle" font-size="13" fill="#334155">줄 1개 읽기 → 변환</text>
  <text x="394" y="540" text-anchor="middle" font-size="13" fill="#334155">yield 에서 1건 넘기고</text>
  <text x="394" y="562" text-anchor="middle" font-size="13" fill="#334155">그 자리에서 멈춤</text>
  <text x="394" y="596" text-anchor="middle" font-size="12" fill="#64748b">(파일 위치를 기억)</text>

  <line x1="498" y1="538" x2="532" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="536" y="458" width="200" height="160" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="636" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">③ 다음 요청</text>
  <text x="636" y="512" text-anchor="middle" font-size="13" fill="#334155">멈춘 곳부터 다시 실행</text>
  <text x="636" y="540" text-anchor="middle" font-size="13" fill="#334155">다음 줄 → yield → 멈춤</text>
  <text x="636" y="562" text-anchor="middle" font-size="13" fill="#334155">(반복)</text>
  <text x="636" y="596" text-anchor="middle" font-size="12" fill="#64748b">이전 줄은 버려도 됨</text>

  <line x1="740" y1="538" x2="774" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="778" y="458" width="172" height="160" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="864" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">④ 파일 끝</text>
  <text x="864" y="512" text-anchor="middle" font-size="13" fill="#334155">함수가 끝나면</text>
  <text x="864" y="540" text-anchor="middle" font-size="13" fill="#334155">for 문 자동 종료</text>
  <text x="864" y="562" text-anchor="middle" font-size="13" fill="#334155">with 가 파일 닫음</text>
  <text x="864" y="596" text-anchor="middle" font-size="12" fill="#64748b">(StopIteration)</text>
</svg>
