<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="640" rx="18" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">모듈 · 클래스 책임 나누기 = 식당의 역할 분담</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#475569">위에서 아래로만 부탁한다 (CLI → 서비스 → 저장소). 아래 계층은 위 계층을 모른다.</text>

  <!-- decorator side bar -->
  <rect x="30" y="92" width="44" height="480" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="52" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce" transform="rotate(-90 52 332)">decorators.py — @handle_errors 로 모든 명령을 감싼다</text>

  <!-- CLI -->
  <rect x="90" y="92" width="560" height="102" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="112" y="122" font-size="18" font-weight="700" fill="#1e3a8a">① cli.py — 카운터 직원</text>
  <text x="630" y="122" text-anchor="end" font-size="13" fill="#1d4ed8">argparse · input() · print()</text>
  <text x="112" y="150" font-size="14" fill="#334155">• 명령/옵션 해석, 대화형 질문, 결과 출력, 종료 코드 반환</text>
  <text x="112" y="175" font-size="14" fill="#64748b">• 모르는 것: 파일이 JSONL인지 CSV인지, 합계 계산 방법</text>

  <line x1="370" y1="196" x2="370" y2="218" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Service -->
  <rect x="90" y="222" width="560" height="102" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="112" y="252" font-size="18" font-weight="700" fill="#166534">② service.py — 주방장 (BudgetService)</text>
  <text x="630" y="252" text-anchor="end" font-size="13" fill="#15803d">규칙 · 계산</text>
  <text x="112" y="280" font-size="14" fill="#334155">• 입력 검증, 최신순 정렬, 월 요약·TOP N·예산 사용률, 카테고리 사용 여부</text>
  <text x="112" y="305" font-size="14" fill="#64748b">• 모르는 것: 화면에 어떻게 찍히는지, 파일을 어떻게 여는지</text>

  <line x1="370" y1="326" x2="370" y2="348" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Storage -->
  <rect x="90" y="352" width="560" height="102" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="112" y="382" font-size="18" font-weight="700" fill="#92400e">③ storage.py — 창고 관리인</text>
  <text x="630" y="382" text-anchor="end" font-size="13" fill="#b45309">파일 I/O</text>
  <text x="112" y="410" font-size="14" fill="#334155">• TransactionRepository · CategoryStore · BudgetStore (파일 1개당 1클래스)</text>
  <text x="112" y="435" font-size="14" fill="#64748b">• 모르는 것: 예산 초과 여부, "사용 중 카테고리는 못 지운다" 같은 규칙</text>

  <!-- Model -->
  <rect x="90" y="470" width="560" height="102" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="112" y="500" font-size="18" font-weight="700" fill="#0f172a">④ models.py — 주문서 양식</text>
  <text x="630" y="500" text-anchor="end" font-size="13" fill="#475569">@dataclass</text>
  <text x="112" y="528" font-size="14" fill="#334155">• Transaction(id, type, date, amount, category, memo, tags)</text>
  <text x="112" y="553" font-size="14" fill="#64748b">• 모든 계층이 같은 양식을 주고받는다 (딕셔너리 대신)</text>

  <!-- right side: why -->
  <rect x="680" y="92" width="290" height="480" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="825" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">왜 이렇게 나누나?</text>

  <rect x="698" y="142" width="254" height="120" rx="10" fill="#f8fafc"/>
  <text x="712" y="168" font-size="14.5" font-weight="700" fill="#1d4ed8">바꿀 곳이 한 군데</text>
  <text x="712" y="194" font-size="13" fill="#334155">저장 포맷을 바꿔도</text>
  <text x="712" y="215" font-size="13" fill="#334155">storage.py 만 고친다.</text>
  <text x="712" y="236" font-size="13" fill="#334155">출력 모양을 바꿔도 cli.py 만.</text>

  <rect x="698" y="274" width="254" height="120" rx="10" fill="#f8fafc"/>
  <text x="712" y="300" font-size="14.5" font-weight="700" fill="#15803d">설명하기 쉽다</text>
  <text x="712" y="326" font-size="13" fill="#334155">"이 기능은 어디 있어?"</text>
  <text x="712" y="347" font-size="13" fill="#334155">→ 역할 이름만 보고 찾는다.</text>
  <text x="712" y="368" font-size="13" fill="#334155">파일 하나에 몰면 찾기 어렵다.</text>

  <rect x="698" y="406" width="254" height="148" rx="10" fill="#f8fafc"/>
  <text x="712" y="432" font-size="14.5" font-weight="700" fill="#b45309">경계를 정한 기준</text>
  <text x="712" y="458" font-size="13" fill="#334155">질문 하나로 판단:</text>
  <text x="712" y="481" font-size="13" fill="#334155">"이 코드가 바뀌는 이유는?"</text>
  <text x="712" y="504" font-size="13" fill="#334155">화면 바뀜 → CLI</text>
  <text x="712" y="525" font-size="13" fill="#334155">규칙 바뀜 → 서비스</text>
  <text x="712" y="546" font-size="13" fill="#334155">파일 형식 바뀜 → 저장소</text>

  <text x="500" y="610" text-anchor="middle" font-size="13.5" fill="#475569">진입점: __main__.py (python -m budget_app 실행 시 cli.main() 호출) · 오류 정의: errors.py</text>
</svg>
